<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Temu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1>Small Temu</h1>
        <button id="cart-toggle" class="cart-toggle" aria-expanded="false" aria-controls="cart">
            Cart <span id="cart-count" class="badge">0</span>
        </button>
    </header>

    <main>
        <section class="controls">
            <input type="search" id="search" placeholder="Search products" aria-label="Search products">
            <select id="sort" aria-label="Sort products">
                <option value="default">Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </section>

        <div id="categories" class="categories" role="group" aria-label="Filter by category"></div>

        <p id="result-count" class="muted" aria-live="polite"></p>

        <div id="product">
        </div>
    </main>

    <div id="overlay" class="overlay"></div>

    <aside id="cart" class="cart" aria-label="Shopping cart">
        <div class="cart-head">
            <h2>Your cart</h2>
            <button id="cart-close" class="icon-btn" aria-label="Close cart">&times;</button>
        </div>

        <div id="cart-items" class="cart-items"></div>

        <div class="cart-foot">
            <p class="cart-total"><span>Total</span> <strong id="cart-total">₦0</strong></p>
            <button id="checkout" class="primary">Place order</button>
            <button id="clear-cart" class="link-btn">Clear cart</button>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
