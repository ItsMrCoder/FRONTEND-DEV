<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="dashboard">
        <aside class="sidebar">
            <h1>EduManage</h1>

            <nav>
                <a href="" class="active">Dashboard</a>
                <a href="">Students</a>
                <a href="">Department</a>
                <a href="">Reports</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Student Management</h1>
                    <p>Manage students and academic performance</p>
                </div>

                <button id="addStudentBtn">
                    Add Student
                </button>
            </header>

            <section class="statistics">
                <div class="stat-card">
                    <span>Total Students</span>
                    <h2 id="totalStudents">0</h2>
                </div>

                <div>
                    <span>Avearge Score</span>
                    <h2 id="averageScore">0</h2>
                </div>

                <div>
                    <span>Highest Score</span>
                    <h2 id="highestScore">0</h2>
                </div>

                <div>
                    <span>Lowest Score</span>
                    <h2 id="lowestScore">0</h2>
                </div>
            </section>

            <section>
                <input type="text" id="searchInput" placeholder="Search Student...">
                <select id="departmentFilter">
                    <option value="all">All department</option>
                    <option value="computer">Computer Science</option>
                    <option value="accoounting">Accounting</option>
                    <option value="engineering">Engineering</option>
                </select>
            </section>

            <section class="student-section">
                <table>
                                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Score</th>
                    <th>Grade</th>
                    <th>Actions</th>   <!-- NEW -->
                </tr>
            </thead>

                    <tbody id="studentTableBody">
                        
                       
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <div class="model-header">

                <h2 id="modelTitle">
                    Add Student
                </h2>

                <button id="closeModal">
                    X
                </button>
            </div>
                   <form id="studentForm">
            <input type="text" id="studentName"placeholder="Full Name" required>
            <input type="email" id="studentEmail" placeholder="Email" required>

        <select  id="studentDepartment" required>       
            <option value="" disabled>
                Select Department
            </option>

            <option value="computer">
                Computer Science 
            </option>

            <option value="accounting">
                Accounting
            </option>

            <option value="engineering">
                Engineering
            </option>
        </select>

        <input type="number" id="studentScore" placeholder="Score" min="0" max="100" required>

        <button type="submit">Save Student</button>
    </form>


        </div>
    </div>
    
  

   
    <script src="app.js" defer></script>
</body>
</html>
